name: Sync Upstream

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync (for example, v1.2.3)
        required: false
        type: string
        default: ''
      release_homebrew:
        description: Trigger the Homebrew tap release workflow
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    outputs:
      release_tag: ${{ steps.upstream.outputs.tag }}
      release_version: ${{ steps.upstream.outputs.version }}
      main_sha: ${{ steps.sync.outputs.main_sha }}
      should_sync: ${{ steps.upstream.outputs.should_sync }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: omlahore/RemoveMacAI
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "$INPUT_TAG" ]]; then
            selected_release="$(gh api \
              "repos/$UPSTREAM_REPO/releases/tags/$INPUT_TAG")"
            selected_tag="$(jq -r '.tag_name' <<< "$selected_release")"
            echo "Using requested release tag: $selected_tag"
          else
            cutoff="$(date -u -d '36 hours ago' +%s)"
            upstream_releases="$(gh api --paginate --slurp \
              "repos/$UPSTREAM_REPO/releases" | jq 'add')"

            selected_release="$(jq -c --argjson cutoff "$cutoff" '
              [
                .[]
                | select(.draft == false and .prerelease == false)
                | select(.published_at != null)
                | select((.published_at | fromdateiso8601) <= $cutoff)
                | select(.author.login == "github-actions[bot]")
              ]
              | sort_by(.published_at | fromdateiso8601)
              | last // empty
            ' <<< "$upstream_releases")"

            if [[ -z "$selected_release" ]]; then
              echo "No GitHub Actions release older than 36 hours was found." >&2
              exit 1
            fi

            selected_tag="$(jq -r '.tag_name' <<< "$selected_release")"
          fi

          if ! jq -e '.draft == false' <<< "$selected_release" >/dev/null; then
            echo "Selected upstream release is a draft; refusing to sync." >&2
            exit 1
          fi

          echo "tag=$selected_tag" >> "$GITHUB_OUTPUT"
          echo "version=$selected_tag" >> "$GITHUB_OUTPUT"

          releases_file="$RUNNER_TEMP/current-releases.json"
          gh api --paginate --slurp \
            "repos/$REPO/releases" | jq 'add' > "$releases_file"

          should_sync="$(python3 - "$selected_tag" "$releases_file" <<'PY'
          import json
          import re
          import sys

          selected_tag, releases_path = sys.argv[1:3]

          pattern = re.compile(
              r"^v?"
              r"(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)"
              r"(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?"
              r"(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$"
          )

          def parse_semver(tag):
              match = pattern.fullmatch(tag)
              if not match:
                  raise ValueError(f"not a valid SemVer tag: {tag!r}")

              major, minor, patch, prerelease, _build = match.groups()
              prerelease_ids = prerelease.split(".") if prerelease else []

              for identifier in prerelease_ids:
                  if (
                      identifier.isdigit()
                      and len(identifier) > 1
                      and identifier.startswith("0")
                  ):
                      raise ValueError(
                          f"invalid numeric prerelease identifier in tag {tag!r}"
                      )

              return (
                  (int(major), int(minor), int(patch)),
                  prerelease_ids,
              )

          def compare(a, b):
              if a[0] != b[0]:
                  return (a[0] > b[0]) - (a[0] < b[0])

              a_pre, b_pre = a[1], b[1]

              if not a_pre and b_pre:
                  return 1
              if a_pre and not b_pre:
                  return -1
              if not a_pre and not b_pre:
                  return 0

              for a_id, b_id in zip(a_pre, b_pre):
                  if a_id == b_id:
                      continue

                  a_numeric = a_id.isdigit()
                  b_numeric = b_id.isdigit()

                  if a_numeric and b_numeric:
                      return (int(a_id) > int(b_id)) - (int(a_id) < int(b_id))
                  if a_numeric != b_numeric:
                      return -1 if a_numeric else 1
                  return (a_id > b_id) - (a_id < b_id)

              return (len(a_pre) > len(b_pre)) - (len(a_pre) < len(b_pre))

          try:
              selected_version = parse_semver(selected_tag)

              with open(releases_path, encoding="utf-8") as f:
                  releases = json.load(f)

              if any(release.get("tag_name") == selected_tag for release in releases):
                  print(
                      f"Release {selected_tag} already exists in the target repository; "
                      "skipping.",
                      file=sys.stderr,
                  )
                  print("false")
                  raise SystemExit(0)

              published = [
                  release for release in releases
                  if not release.get("draft", False)
              ]

              current = None
              for release in published:
                  tag = release.get("tag_name")
                  try:
                      version = parse_semver(tag)
                  except (TypeError, ValueError) as exc:
                      raise ValueError(
                          f"Cannot safely compare against published target release "
                          f"{tag!r}: {exc}"
                      ) from exc

                  if current is None or compare(version, current[1]) > 0:
                      current = (tag, version)

              if current is not None:
                  current_tag, current_version = current
                  if compare(selected_version, current_version) <= 0:
                      print(
                          f"Selected {selected_tag} is not newer than current "
                          f"release {current_tag}; skipping.",
                          file=sys.stderr,
                      )
                      print("false")
                      raise SystemExit(0)

              print("true")

          except (OSError, json.JSONDecodeError, TypeError, ValueError) as exc:
              print(f"Cannot safely determine whether to sync: {exc}", file=sys.stderr)
              raise SystemExit(1)
          PY
          )"

          echo "should_sync=$should_sync" >> "$GITHUB_OUTPUT"

          if [[ "$should_sync" != "true" ]]; then
            exit 0
          fi

          selected_sha="$(gh api \
            "repos/$UPSTREAM_REPO/commits/$selected_tag" --jq '.sha')"

          echo "sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "Selected $selected_tag ($selected_sha); it is newer than the current release."

      - name: Import upstream snapshot and create verified commit
        id: sync
        if: steps.upstream.outputs.should_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          UPSTREAM_REPO: omlahore/RemoveMacAI
          EXPECTED_REPO_ID: "1394989252"
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::add-mask::$SYNC_TOKEN"

          actions_auth_header="$(printf 'x-access-token:%s' "$ACTIONS_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $actions_auth_header" \
            fetch --no-tags origin main

          base_sha="$(git rev-parse FETCH_HEAD)"
          git switch --detach "$base_sha"

          upstream_dir="$RUNNER_TEMP/remove-mac-ai-upstream"
          git clone --quiet --depth=1 --single-branch \
            --branch "$UPSTREAM_TAG" \
            "https://github.com/$UPSTREAM_REPO.git" \
            "$upstream_dir"

          actual_upstream_sha="$(git -C "$upstream_dir" rev-parse HEAD)"
          if [[ "$actual_upstream_sha" != "$UPSTREAM_SHA" ]]; then
            echo "Upstream tag changed after selection; refusing to sync." >&2
            exit 1
          fi

          actual_id="$(gh api "repos/$UPSTREAM_REPO" --jq '.id')"
          if [[ "$actual_id" != "$EXPECTED_REPO_ID" ]]; then
            echo "Upstream repository ID mismatch; refusing to sync." >&2
            exit 1
          fi

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='/.github/' \
            "$upstream_dir/" "$GITHUB_WORKSPACE/"

          git add -A
          if git diff --cached --quiet; then
            echo "main_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "Upstream snapshot matches main; nothing to sync."
            exit 0
          fi

          commit_message="Release $UPSTREAM_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$commit_message"

          staging_branch="sync-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_staging_ref() {
            gh api --method DELETE \
              "repos/$REPO/git/refs/heads/$staging_branch" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_staging_ref EXIT

          staging_auth_header="$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $staging_auth_header" \
            push origin "HEAD:refs/heads/$staging_branch"

          current_main_sha="$(gh api \
            "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main_sha" != "$base_sha" ]]; then
            echo "main moved during sync; refusing to overwrite it." >&2
            exit 1
          fi

          staging_sha="$(gh api \
            "repos/$REPO/git/ref/heads/$staging_branch" --jq '.object.sha')"
          tree_sha="$(gh api \
            "repos/$REPO/git/commits/$staging_sha" --jq '.tree.sha')"

          commit_payload="$(jq -n \
            --arg message "$commit_message" \
            --arg tree "$tree_sha" \
            --arg parent "$base_sha" \
            '{
              message: $message,
              tree: $tree,
              parents: [$parent]
            }')"

          final_sha="$(GH_TOKEN="$ACTIONS_TOKEN" gh api \
            --method POST "repos/$REPO/git/commits" \
            --input - <<< "$commit_payload" \
            --jq '.sha')"

          verification="$(GH_TOKEN="$ACTIONS_TOKEN" gh api \
            "repos/$REPO/git/commits/$final_sha" \
            --jq '.verification')"
          verified="$(jq -r '.verified' <<< "$verification")"
          reason="$(jq -r '.reason' <<< "$verification")"

          if [[ "$verified" != "true" ]]; then
            echo "GitHub did not verify commit $final_sha (reason: $reason)." >&2
            exit 1
          fi

          gh api --method PATCH \
            "repos/$REPO/git/refs/heads/main" \
            -f "sha=$final_sha" \
            -F force=false >/dev/null

          cleanup_staging_ref
          trap - EXIT

          echo "main_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Updated main with verified commit $final_sha"

  build-and-release:
    needs: sync
    if: ${{ needs.sync.result == 'success' && needs.sync.outputs.should_sync == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 90

    permissions:
      contents: write
      id-token: write
      attestations: write

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.sync.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.sync.outputs.release_version }}
      MAIN_SHA: ${{ needs.sync.outputs.main_sha }}

    steps:
      - name: Check whether this release already exists
        id: existing
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout synced source
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.main_sha }}
          persist-credentials: false

      - name: Build
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          swift build -c release --arch arm64

      - name: Self-test
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          bin_path="$(swift build -c release --arch arm64 --show-bin-path)"
          "$bin_path/removemacai" selftest

      - name: Package
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p stage dist
          bin_path="$(swift build -c release --arch arm64 --show-bin-path)"
          cp "$bin_path/removemacai" LICENSE THIRD-PARTY-NOTICES.md stage/

          COPYFILE_DISABLE=1 tar -czf \
            dist/removemacai-darwin-arm64.tar.gz \
            -C stage removemacai LICENSE THIRD-PARTY-NOTICES.md

          tools/build-app.sh
          ditto -c -k --keepParent .build/RemoveMacAI.app dist/RemoveMacAI.zip

          cd dist
          shasum -a 256 removemacai-darwin-arm64.tar.gz \
            > removemacai-darwin-arm64.tar.gz.sha256
          shasum -a 256 RemoveMacAI.zip > RemoveMacAI.zip.sha256

      - name: Attest build provenance
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/removemacai-darwin-arm64.tar.gz
            dist/RemoveMacAI.zip

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          gh release create "$RELEASE_TAG" dist/* \
            --target "$MAIN_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Synced from upstream: https://github.com/omlahore/RemoveMacAI/releases/tag/$RELEASE_TAG"

      - name: Trigger Homebrew tap autobump
        if: ${{ success() && inputs.release_homebrew }}
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$UPDATE_TOKEN" gh api \
            --method POST \
            "repos/$REPOSITORY_OWNER/homebrew-tap/actions/workflows/autobump.yml/dispatches" \
            -f ref=main
